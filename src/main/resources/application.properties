spring.application.name=SystemEgzaminacyjny

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/system_egzaminacyjny}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:egzaminy}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:egzaminy}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
