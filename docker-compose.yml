services:
  postgres:
    image: postgres:16
    container_name: system-egzaminacyjny-postgres
    environment:
      POSTGRES_DB: system_egzaminacyjny
      POSTGRES_USER: egzaminy
      POSTGRES_PASSWORD: egzaminy
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
